<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>シャドーイング練習</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="シャドーイング">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#201f24" media="(prefers-color-scheme: dark)">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="app-header">
  <h1>シャドーイング練習</h1>
</header>

<main>
  <!-- 練習 -->
  <section id="tab-practice" class="tab-panel active">
    <div id="practice-empty" class="empty-state">
      <p>まだスクリプトが選ばれていません。</p>
      <button id="btn-goto-list" class="wide">スクリプトを追加・選択する</button>
    </div>

    <div id="practice-body" hidden>
      <div class="script-nav">
        <button id="btn-prev" class="icon-btn" aria-label="前のスクリプト">‹</button>
        <span id="practice-position"></span>
        <button id="btn-next" class="icon-btn" aria-label="次のスクリプト">›</button>
      </div>

      <p id="practice-text" class="practice-text"></p>
      <p id="practice-note" class="practice-note"></p>

      <div class="player">
        <input type="range" id="seek" class="seek" min="0" max="1000" value="0" step="1" aria-label="再生位置">
        <div class="time-row">
          <span id="time-current">0:00</span>
          <span id="time-total">0:00</span>
        </div>

        <div class="transport">
          <button id="btn-rewind" class="round" aria-label="5秒戻る">−5<small>秒</small></button>
          <button id="btn-playpause" class="round primary" aria-label="再生">▶</button>
          <button id="btn-forward" class="round" aria-label="5秒進む">+5<small>秒</small></button>
        </div>

        <div class="player-options">
          <label class="speed">
            <span>速度 <output id="speed-value">1.00x</output></span>
            <input type="range" id="speed-range" min="0.5" max="1.25" step="0.05" value="1">
          </label>
          <label class="switch">
            <input type="checkbox" id="loop-toggle"> リピート再生
          </label>
        </div>

        <div class="ab-row">
          <button id="btn-ab" class="ab-btn">A-B区間リピート</button>
          <button id="btn-ab-clear" class="ab-btn ghost" hidden>解除</button>
        </div>

        <button id="btn-generate" class="wide">音声を生成</button>
        <p id="player-status" class="player-status"></p>
      </div>

      <button id="btn-mark-practiced" class="wide secondary">練習済みにする</button>
      <p id="practice-stats" class="stats"></p>
    </div>
  </section>

  <!-- スクリプト一覧 -->
  <section id="tab-list" class="tab-panel">
    <form id="script-form">
      <h2>例文・表現を追加</h2>
      <label>英語スクリプト
        <textarea id="input-text" rows="4" placeholder="長い文章を貼り付けてもかまいません。" required></textarea>
      </label>
      <label class="switch inline">
        <input type="checkbox" id="input-split" checked> 文ごとに分けて登録する
      </label>
      <label>意味・メモ(任意)
        <input type="text" id="input-note" placeholder="ずっと連絡しようと思っていた">
      </label>
      <label>タグ(任意・カンマ区切り)
        <input type="text" id="input-tags" placeholder="ビジネス, 口語">
      </label>
      <button type="submit" class="wide">追加</button>
    </form>

    <h2>登録済み <span id="script-count" class="count"></span></h2>
    <input type="search" id="search-input" class="search" placeholder="スクリプトを検索" aria-label="スクリプトを検索">
    <div id="script-list" class="script-list"></div>
  </section>

  <!-- 設定 -->
  <section id="tab-settings" class="tab-panel">
    <h2>ElevenLabs API</h2>
    <p class="hint">APIキーはこの端末のブラウザにのみ保存され、GitHubには送信されません。</p>
    <form id="settings-form">
      <label>API Key
        <input type="password" id="input-api-key" placeholder="sk_..." autocomplete="off">
      </label>
      <label>Voice ID
        <input type="text" id="input-voice-id" placeholder="My Voices からコピーしたID" autocomplete="off">
      </label>
      <button type="submit" class="wide">保存</button>
    </form>

    <h2>データ</h2>
    <p class="hint">生成した音声はこの端末に保存され、次回以降はAPIを使わず再生されます。</p>
    <div class="button-column">
      <button id="btn-export" class="wide secondary">スクリプトをJSONで書き出す</button>
      <label class="wide secondary file-btn">
        JSONを読み込む
        <input type="file" id="input-import" accept="application/json,.json" hidden>
      </label>
      <button id="btn-load-sample" class="wide secondary">サンプルを読み込む</button>
      <button id="btn-clear-audio" class="wide secondary">保存済み音声を削除</button>
    </div>

    <h2>ホーム画面に追加</h2>
    <p class="hint">ブラウザの共有ボタンから「ホーム画面に追加」を選ぶと、アプリのように全画面で起動できます。</p>
  </section>
</main>

<nav class="tabbar">
  <button class="tab-btn active" data-tab="practice"><span class="icon">▶</span>練習</button>
  <button class="tab-btn" data-tab="list"><span class="icon">☰</span>スクリプト</button>
  <button class="tab-btn" data-tab="settings"><span class="icon">⚙</span>設定</button>
</nav>

<div id="toast" class="toast" hidden></div>

<script src="app.js"></script>
</body>
</html>
